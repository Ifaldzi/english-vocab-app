name: Deploy to VPS

# Auto-triggers on any push to a `release/*` branch (e.g. release/2026-08-29).
# The pipeline validates the branch name, then runs test -> build -> deploy
# -> tag. The `deploy` job targets the `production` GitHub environment: if you
# enable "Required reviewers" on that environment, the deploy pauses for a
# manual approval before anything touches the VPS. `workflow_dispatch` keeps
# a manual run available too. A semver tag is created only after a successful
# deploy so every live version is recoverable via `git checkout <tag>`.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Seed the production database after deploy (badges + Oxford 3000 words)'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize deploys: two runs against the same release must not race
# (deploy + tag must be sequential). Never cancel an in-flight deploy.
concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  validate-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ ! "$BRANCH" =~ ^release/ ]]; then
            echo "::error::This workflow only deploys from a release/* branch, got '$BRANCH'"
            exit 1
          fi
          echo "Deploying branch: $BRANCH"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate-branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # GA_MEASUREMENT_ID is public by nature and inlined into the client
      # bundle at build time. Optional: set it as a repo variable to enable
      # client-side gtag tracking.
      - name: Build
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run build
      # Tar the build before uploading: upload-artifact v4+ excludes dot-
      # prefixed paths (.output/) and the hidden-files opt-in is buggy. A
      # plain tarball round-trips deterministically. The migration runner and
      # the drizzle/ folder ship with the build so migrations can run on the
      # VPS against the live DB. seed-src/ ships the real seeder (scripts +
      # schema + Oxford data) so it can be run on the VPS on demand.
      - name: Package build output
        run: |
          cp scripts/server-migrate.mjs .output/server/migrate.mjs
          rm -rf seed-src
          mkdir -p seed-src/scripts seed-src/src/db seed-src/src/lib seed-src/data
          cp scripts/seed.ts seed-src/scripts/
          cp src/db/index.ts src/db/schema.ts src/db/seed.ts seed-src/src/db/
          cp src/lib/types.ts seed-src/src/lib/
          cp data/oxford_3000.json seed-src/data/
          cp -R drizzle seed-src/drizzle
          tar -czf build-output.tar.gz .output drizzle seed-src
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Approval gate: with the `production` environment's "Required reviewers"
    # enabled, GitHub pauses this job here until an approved reviewer runs the
    # deploy. Test/build already ran; nothing touches the VPS before approval.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract build output
        run: tar -xzf build-output.tar.gz

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Guard against rsync --delete wiping the server dir if the build was
      # ever empty (e.g. artifact/extract failure). Fail before touching VPS.
      - name: Verify build output
        run: |
          test -f .output/server/index.mjs && test -d .output/public \
            && echo "build output OK" \
            || (echo "::error::.output is missing build files" && exit 1)

      - name: Copy build to VPS
        run: |
          rsync -az --delete \
            --exclude 'server/node_modules' \
            -e "ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            .output/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/.output/"

      - name: Copy migrations to VPS
        run: |
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            drizzle/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/drizzle/"

      # better-sqlite3 ships native binaries; rebuild them on the VPS so the
      # prebuilt binary always matches the server's OS/arch/glibc. drizzle-orm
      # is added so the migration runner can run against the live DB.
      - name: Install native dependencies on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            cd "${{ secrets.VPS_PATH }}/.output/server" && npm install --omit=dev drizzle-orm
          '

      - name: Run database migrations
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            mkdir -p "${{ secrets.VPS_PATH }}/data"
            cd "${{ secrets.VPS_PATH }}/.output/server"
            DATABASE_PATH="${{ secrets.VPS_PATH }}/data/worddeck.db" \
              MIGRATIONS_FOLDER="${{ secrets.VPS_PATH }}/drizzle" \
              node migrate.mjs
          '

      # Only runs when the workflow is manually dispatched with the "run_seed"
      # toggle on; never on push-triggered deploys. Idempotent: badges upsert,
      # words are skipped when already present.
      - name: Seed database (manual only)
        if: inputs.run_seed
        run: |
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            seed-src/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/seed-src/"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            cd "${{ secrets.VPS_PATH }}/seed-src"
            npm install --no-save --no-package-lock better-sqlite3 drizzle-orm tsx
            DATABASE_PATH="${{ secrets.VPS_PATH }}/data/worddeck.db" npx tsx scripts/seed.ts
          '

      - name: Verify server Node version
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            echo "Server node: $(node --version)"
            major=$(node -p "Number(process.versions.node.split(\".\")[0])")
            if [ "$major" -lt 22 ]; then
              echo "::error::Server Node must be >= 22 (found $major). Set the nvm default to Node 22 LTS."
              exit 1
            fi
          '

      - name: Start or reload app
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1
            nvm use default >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            export PORT="${{ vars.APP_PORT || 3000 }}"
            cd "${{ secrets.VPS_PATH }}" || exit 1
            mkdir -p data
            export DATABASE_PATH="$PWD/data/worddeck.db"
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
              export SENTENCE_VALIDATOR=ai
              export GEMINI_MODEL="${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}"
            fi
            if pm2 describe "${{ vars.VPS_APP_NAME }}" >/dev/null 2>&1; then
              pm2 reload "${{ vars.VPS_APP_NAME }}" --update-env || pm2 restart "${{ vars.VPS_APP_NAME }}" --update-env
            else
              if [ -f "${{ secrets.VPS_PATH }}/.env" ]; then
                pm2 start .output/server/index.mjs --name "${{ vars.VPS_APP_NAME }}" --node-args="--env-file=${{ secrets.VPS_PATH }}/.env"
              else
                pm2 start .output/server/index.mjs --name "${{ vars.VPS_APP_NAME }}"
              fi
              pm2 save
            fi
          '

      - name: Health check
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sleep 3 && curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:${{ vars.APP_PORT || 3000 }}/ && echo HEALTH_OK"

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag -l 'v*' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            echo "next=v0.1.0" >> "$GITHUB_OUTPUT"
          else
            ver=${latest#v}
            major=${ver%%.*}
            minor=${ver#*.}; minor=${minor%%.*}
            patch=${ver##*.}
            patch=$((10#$patch + 1))
            echo "next=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          fi
          echo "Next version: ${{ steps.version.outputs.next }}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"
